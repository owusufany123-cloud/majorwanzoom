<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Create your Major Zoom Prayers and Teachings account."
    >

    <meta
        name="theme-color"
        content="#07090d"
    >

    <title>
        Create Account | Major Zoom Prayers and Teachings
    </title>

    <link
        rel="stylesheet"
        href="register.css"
    >

</head>


<body>


    <!-- =====================================================
         REGISTER PAGE
         ===================================================== -->

    <main class="register-page">

        <section
            class="register-card"
            aria-labelledby="registerTitle"
        >


            <!-- =================================================
                 BRAND
                 ================================================= -->

            <div class="brand">

                <div
                    class="brand-mark"
                    aria-hidden="true"
                >
                    MZ
                </div>

                <div class="brand-text">

                    <strong>
                        MAJOR ZOOM
                    </strong>

                    <span>
                        PRAYERS &amp; TEACHINGS
                    </span>

                </div>

            </div>


            <!-- =================================================
                 HEADER
                 ================================================= -->

            <div class="register-header">

                <span class="eyebrow">
                    JOIN THE COMMUNITY
                </span>

                <h1 id="registerTitle">
                    Create Your Account
                </h1>

                <p>
                    Create your account to join prayers,
                    Bible teachings and fellowship.
                </p>

            </div>


            <!-- =================================================
                 REGISTER FORM
                 ================================================= -->

            <form
                id="registerForm"
                novalidate
            >


                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        inputmode="email"
                        required
                    >

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                        inputmode="tel"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                            aria-controls="password"
                            aria-pressed="false"
                        >
                            SHOW
                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            id="toggleConfirmPassword"
                            class="password-toggle"
                            aria-label="Show password"
                            aria-controls="confirmPassword"
                            aria-pressed="false"
                        >
                            SHOW
                        </button>

                    </div>

                </div>


                <!-- =================================================
                     PLATFORM GUIDELINES
                     ================================================= -->

                <div class="terms-row">

                    <label class="checkbox-label">

                        <input
                            type="checkbox"
                            id="agreeTerms"
                            name="agreeTerms"
                        >

                        <span>
                            I agree to the platform guidelines.
                        </span>

                    </label>

                </div>


                <!-- =================================================
                     MESSAGE
                     ================================================= -->

                <div
                    id="registerMessage"
                    class="register-message"
                    role="alert"
                    aria-live="polite"
                ></div>


                <!-- =================================================
                     SUBMIT
                     ================================================= -->

                <button
                    type="submit"
                    class="register-button"
                    id="registerButton"
                >
                    CREATE ACCOUNT
                </button>


            </form>


            <!-- =================================================
                 LOGIN LINK
                 ================================================= -->

            <div class="account-link">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Sign In
                </a>

            </div>


            <!-- =================================================
                 BACK HOME
                 ================================================= -->

            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>


        </section>

    </main>


    <!-- =====================================================
         SUPABASE
         ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="supabase-config.js"></script>

    <script src="register.js"></script>


</body>

</html>
